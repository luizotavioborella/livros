<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca Virtual</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main>
    <div class="cabecalho">
        <h2>Editar Livro</h2>
        <a href="{{ url_for('home') }}" class="btn-voltar">← Voltar</a>
    </div>

    <form action="{{ url_for('editar', id=livro[0]) }}" method="post">
        <label for="nome">Título</label>
        <input type="text" id="nome" name="nome" value="{{ livro[1] }}" required>

        <label for="autor">Autor</label>
        <input type="text" id="autor" name="autor" value="{{ livro[2] }}" required>

        <label for="ano_publicado">Ano Publicado:</label>
        <input type="number" id="ano_publicado" name="ano_publicado" value="{{ livro[3] }}" required>

        <div><button type="submit" class="btn">Salvar Alterações</button></div>
    </form>
</main>
</body>
</html>
