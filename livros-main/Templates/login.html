<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca Virtual</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main>
    <div class="cabecalho">
        <h2>Login</h2>
    </div>
    <form action="/login" method="post">
        <label>Digite seu nome completo:</label>
        <input type="text" name="nome" id="nome" placeholder="Ex.: Luiz Otávio Borella" required>

        <label>Digite seu e-mail:</label>
        <input type="text" name="email" id="email" placeholder="Ex.: usuario@email.com" required>

        <label>Digite sua senha:</label>
        <input type="password" name="senha" id="senha" placeholder="Ex.: 1234" required>

        <div><button type="submit" class="btn">Cadastrar</button></div>
        <a href="cadastrar_usuario.html">Ainda não tem uma conta? Cadastre-se</a>
    </form>
</main>
</body>
</html>
