<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca Virtual</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main>
    <div class="cabecalho">
        <h2>Login</h2>
        <a href="{{ url_for('index') }}" class="btn-voltar">← Voltar</a>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-messages">
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}
    <form action="{{ url_for('login') }}" method="post">
        <label>Digite seu nome completo:</label>
        <input type="text" name="nome" id="nome" placeholder="Ex.: Luiz Otávio Borella" required>

        <label>Digite seu e-mail:</label>
        <input type="text" name="email" id="email" placeholder="Ex.: usuario@email.com" required>

        <label>Digite sua senha:</label>
        <input type="password" name="senha" id="senha" placeholder="Ex.: 1234" required>

        <div><button type="submit" class="btn">Entrar</button></div>
        <a href="{{ url_for('cadastrar_usuario') }}" class="link-cadastro">Ainda não tem uma conta? Cadastre-se</a>
    </form>
</main>
</body>
</html>
